[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aeronetra"
version = "0.1.0"
description = "A serious computer-vision research project for UAV and drone-based surveillance."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AeroNetra Team" }
]
# Import-time runtime requirements. The ultralytics/torch stack is deliberately
# absent: the adapter imports it lazily, so it stays an optional backend.
dependencies = [
    "numpy",
    "opencv-python-headless",
    "PyYAML",
    "matplotlib",
]

[tool.ruff]
line-length = 88
target-version = "py311"
# Notebooks hold exploratory, cell-by-cell code; keep them out of the linter
# so `ruff check .` stays meaningful and stable.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Pin an explicit rule set so CI does not break when Ruff expands its defaults.
select = ["E4", "E7", "E9", "F", "I", "SIM", "PIE", "FURB", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
