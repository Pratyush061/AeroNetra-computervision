# Shared inference hyperparameters for model comparisons
image_size: [640, 640]
confidence_threshold: 0.25
iou_threshold: 0.45
selected_classes: [0, 1, 2, 3, 4, 5, 6, 7] # VisDrone vehicle classes: car, van, truck, tricycle, awning-tricycle, bus, motor, bicycle
max_detections: 300
device: "cpu" # Default to cpu, override in notebook automatically if GPU exists
output_path: "${OUTPUT_DIR}/predictions"
