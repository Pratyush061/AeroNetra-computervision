# Model + training configuration for the RT-DETR-l baseline on VisDrone.
#
# These values mirror kaggle/02_model_training.ipynb. RT-DETR is trained for
# fewer epochs and a shorter patience because it converges faster.
model_name: "RT-DETR-l"
architecture: "rtdetr-l"
weights: "rtdetr-l.pt"
adapter: "ultralytics"
train:
  data: "configs/datasets/visdrone_yolo.yaml"
  epochs: 30
  imgsz: 640
  batch: -1
  patience: 8
  seed: 42
  project: "${OUTPUT_DIR}"
  name: "rtdetr_l_visdrone"
